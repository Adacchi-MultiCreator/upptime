# Upptime の設定（Adacchi Creative ライセンスサーバーの監視）
owner: Adacchi-MultiCreator
repo: upptime

sites:
  # 状況ページ（status.adacchi-creative.com）は slug "license-server" をライセンスサーバー本体として読む
  - name: License server
    slug: license-server
    url: https://license-manager.adacchi-creative.com/api/v1/public-status
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000
  - name: License manager site
    slug: license-manager-site
    url: https://license-manager.adacchi-creative.com/
    maxResponseTime: 10000

# 障害が起きると、このリポジトリに Issue が作られます（GitHub から通知メールが届きます）
assignees:
  - Adacchi-MultiCreator

status-website:
  baseUrl: /upptime
  name: Adacchi Creative 稼働履歴
  introTitle: "**ライセンスサーバーの稼働履歴**"
  introMessage: 5分ごとに自動で確認した記録です。いまの状況は [サービス稼働状況](https://status.adacchi-creative.com/) をご覧ください。
  logoUrl: https://status.adacchi-creative.com/favicon.svg
  favicon: https://status.adacchi-creative.com/favicon.svg
  navbar:
    - title: サービス稼働状況
      href: https://status.adacchi-creative.com/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

workflowSchedule:
  uptime: "*/5 * * * *"
